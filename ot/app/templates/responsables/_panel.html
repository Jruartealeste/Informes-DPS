<div id="panel-responsables">
  <form class="filters" hx-post="/responsables" hx-target="#panel-responsables" hx-swap="outerHTML">
    <div class="filters__search">
      <input type="text" name="nombre" placeholder="Nombre del responsable nuevo" required>
    </div>
    <button type="submit" class="btn btn--primary">+ Agregar</button>
  </form>

  <div class="table-scroll">
    <div class="table-card resp-table">
      <div class="table-head resp-head">
        <div>Nombre</div><div></div>
      </div>
      {% for r in responsables %}
      <div class="resp-row {{ '' if r.activo else 'is-inactivo' }}">
        <div class="resp-row__linea">
          <input type="text" value="{{ r.nombre }}" class="field__value resp-row__nombre"
                 name="nombre" autocomplete="off"
                 hx-post="/responsables/{{ r.id }}/renombrar" hx-trigger="change"
                 hx-target="#panel-responsables" hx-swap="outerHTML">
          <div class="resp-row__acciones">
            <button type="button" class="resp-row__icon-btn {{ 'is-activo' if r.activo else 'is-inactivo' }}"
                    hx-post="/responsables/{{ r.id }}/toggle"
                    hx-target="#panel-responsables" hx-swap="outerHTML"
                    title="{{ 'Desactivar' if r.activo else 'Activar' }}"
                    aria-label="{{ 'Desactivar' if r.activo else 'Activar' }}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
                <line x1="12" x2="12" y1="2" y2="12"></line>
              </svg>
            </button>
            <button type="button" class="resp-row__icon-btn resp-row__icon-btn--editar {{ 'has-mail' if r.mail }}"
                    onclick="toggleMailResponsable(this)"
                    title="{{ 'Editar mail' if r.mail else 'Agregar mail' }}"
                    aria-label="{{ 'Editar mail' if r.mail else 'Agregar mail' }}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 20h9"></path>
                <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"></path>
              </svg>
            </button>
          </div>
        </div>
        <div class="resp-row__mail">
          <input type="email" value="{{ r.mail or '' }}" placeholder="mail@aleste.ar"
                 class="field__value" name="mail" autocomplete="off"
                 hx-post="/responsables/{{ r.id }}/mail" hx-trigger="change"
                 hx-target="#panel-responsables" hx-swap="outerHTML">
        </div>
      </div>
      {% endfor %}
    </div>
    {% if not responsables %}
    <p class="empty-state">Todavía no hay responsables cargados.</p>
    {% endif %}
  </div>
</div>
