{% if ot_bloqueada %}
<div class="field-ot">
  <div class="field-ot__box">
    <span class="field-ot__n">OT {{ ot_numero }}</span>
    <span class="field-ot__cliente">{{ ot_cliente }}</span>
  </div>
</div>
{% else %}
<div class="field-ot">
  <div class="combo">
    <input type="text" name="ot_numero" class="field-ot__box combo__input" style="font-family:var(--mono)"
           autocomplete="off" required value="{{ ot_numero }}" placeholder="Buscar OT interna existente">
    <button type="button" class="combo__toggle" aria-label="Mostrar OT internas">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </button>
    <div class="combo__menu"></div>
  </div>
  <button type="button" class="btn btn--small" title="Generar número de OT interna nuevo"
          hx-get="/api/ordenes-trabajo/nuevo-numero" hx-target="closest .field-ot" hx-swap="outerHTML">
    + Nueva
  </button>
</div>
{% endif %}
