<div class="combo combo--select combo--multi">
  <button type="button" class="combo__display" data-vacio="Sin tipo de tarea">{{ tipos_resumen }}</button>
  <input type="hidden" class="combo__hidden" name="tipos" data-required value="{{ tipos_sel_csv }}">
  <button type="button" class="combo__toggle" aria-label="Mostrar tipos de tarea">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="6 9 12 15 18 9"></polyline>
    </svg>
  </button>
  <div class="combo__menu combo__menu--multi">
    <div class="combo__lista">
      {% for nombre, label in tipos_catalogo %}
      <label class="combo__check-row">
        <input type="checkbox" value="{{ nombre }}" {{ "checked" if nombre in tipos_sel }}>
        <span class="combo__check-row__nombre">{{ label }}</span>
      </label>
      {% endfor %}
    </div>
  </div>
</div>
