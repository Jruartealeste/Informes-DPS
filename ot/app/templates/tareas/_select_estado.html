<div class="combo combo--select combo--chip" onclick="event.stopPropagation()">
  <button type="button" class="combo__display chip-estado" data-valor="{{ t.estado_tarea }}">{{ t.estado_tarea_label }}</button>
  <input type="hidden" class="combo__hidden" name="estado_tarea" value="{{ '' if t.estado_tarea == 'SIN_ESTADO' else t.estado_tarea }}"
    hx-post="/tareas/{{ t.id }}/estado" hx-trigger="change" hx-target="#tabla-tareas" hx-swap="outerHTML">
  <div class="combo__menu">
    <div class="combo__item {{ 'is-selected' if t.estado_tarea == 'SIN_ESTADO' }}" role="option" data-valor="">—</div>
    {% for valor, label in opt_estado %}
    <div class="combo__item {{ 'is-selected' if t.estado_tarea == valor }}" role="option" data-valor="{{ valor }}">{{ label }}</div>
    {% endfor %}
  </div>
</div>
