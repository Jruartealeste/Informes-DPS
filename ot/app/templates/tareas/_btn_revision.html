{# Alerta "Necesitan revisión". Una sola definición: list.html la incluye tal
   cual y _controles.html la incluye con oob=true para re-renderizarla tras
   cada swap de tabla (hx-swap-oob no se procesa en un document load). #}
<button type="button" id="btn-revision"
  class="filters__revision{{ ' has-items' if n_revision else ' is-empty' }}{{ ' is-active' if revision }}"
  {% if oob %}hx-swap-oob="true"{% endif %}
  aria-pressed="{{ 'true' if revision else 'false' }}"
  hx-get="/tareas/partial" hx-target="#tabla-tareas" hx-swap="outerHTML"
  hx-include="#filtros-form [name='q'], #filtros-form [name='f_est'], #filtros-form [name='f_fac'], #filtros-form [name='f_resp']"
  hx-vals='{"revision": "{{ revision_next }}", "agrupado": "{{ 1 if agrupado else 0 }}"}'>
  <svg class="filters__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
  Necesitan revisión <strong>{{ n_revision }}</strong>
</button>
