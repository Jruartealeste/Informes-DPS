{% from "_iconos.html" import icono %}
<div class="drawer-overlay" onclick="cerrarSheet2(event)">
  <div class="drawer" onclick="event.stopPropagation()">
    <div class="drawer__header">
      <div style="min-width:0">
        <div class="drawer__kicker">Duplicar tarea</div>
        <div class="drawer__title">{{ det.detalle }}</div>
      </div>
      <div class="page-header__spacer"></div>
      <button type="button" class="drawer__close" onclick="cerrarSheet2(event)" aria-label="Cerrar" title="Cerrar (Esc)">{{ icono("cerrar") }}</button>
    </div>

    <div class="drawer__body">
      <div class="field">
        <div class="field__label">¿Qué OT interna usa la tarea nueva?
          <span class="info-tip">
            <button type="button" class="info-tip__btn" aria-expanded="false" aria-label="Más información">?</button>
            <span class="info-tip__panel" role="note">Se abre el formulario con los datos copiados; no se guarda nada hasta que apretes Guardar.</span>
          </span></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:10px">
        {% if det.ot_numero_form %}
        <button type="button" class="btn btn--primary"
                hx-get="/tareas/{{ det.id }}/duplicar/form?ot=misma" hx-target="#drawer-root" hx-swap="innerHTML">
          Misma OT interna ({{ det.ot_numero_form }})
        </button>
        {% endif %}
        <button type="button" class="btn"
                hx-get="/tareas/{{ det.id }}/duplicar/form?ot=nueva" hx-target="#drawer-root" hx-swap="innerHTML">
          OT interna nueva (próximo número)
        </button>
      </div>
    </div>
  </div>
</div>
